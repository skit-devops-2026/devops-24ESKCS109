
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-bank
  labels:
    app: digital-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-bank
  template:
    metadata:
      labels:
        app: digital-bank
    spec:
      containers:
        - name: digital-bank
          image: devanshu4116/digital-bank:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
